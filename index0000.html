<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #ff0000;
}

body {
    font-family: "Courier New", monospace;
    overflow: hidden;
}

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
    box-sizing: border-box;
}

.photo-container {
    width: 330px;
    height: 185px;
    max-width: 80vw;
    position: relative;
    overflow: hidden;
}

.photo {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.2s ease, transform 5s ease;
}

.photo.active {
    opacity: 1;
    transform: scale(1);
}

.text-area {
    margin-top: 22px;
    width: 90%;
    text-align: center;
}

#text {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
    min-height: 30px;
}

.cursor {
    display: inline-block;
    width: 6px;
    height: 18px;
    background: #ff0000;
    margin-left: 3px;
    vertical-align: -3px;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

.signature {
    position: fixed;
    bottom: 15px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    color: #ff0000;
}

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 4px
    );
}
</style>

</head>

<body>

<div class="page">

<script>
const sentences = [
    "does deadass mean something to you?",
    "you always say deadass.",
    "always deadass.",
    "trust people who say deadass.",
    "because deadass means something.",
    "or maybe it doesn't anymore.",
    "maybe no content to share.",
    "maybe nothing was ever here.",
    "always deadass."
];

const photos = document.querySelectorAll(".photo");
const text = document.getElementById("text");

let sentenceIndex = 0;
let photoIndex = 0;

function changePhoto(index) {
    photos.forEach(photo => {
        photo.classList.remove("active");
    });

    photos[index % photos.length].classList.add("active");
}

function typeText(sentence, callback) {
    let i = 0;

    const typing = setInterval(() => {
        text.textContent += sentence[i];
        i++;

        if (i >= sentence.length) {
            clearInterval(typing);
            setTimeout(callback, 1400);
        }
    }, 60);
}

function deleteText(callback) {
    const deleting = setInterval(() => {
        text.textContent = text.textContent.slice(0, -1);

        if (text.textContent.length === 0) {
            clearInterval(deleting);
            setTimeout(callback, 300);
        }
    }, 35);
}

function nextSentence() {
    if (sentenceIndex >= sentences.length) {
        sentenceIndex = 0;
    }

    changePhoto(photoIndex);
    photoIndex++;

    typeText(sentences[sentenceIndex], () => {
        deleteText(() => {
            sentenceIndex++;
            nextSentence();
        });
    });
}

setTimeout(nextSentence, 1000);
</script>
